version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chaosctrl-backend:latest
    container_name: chaosctrl-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      # Point to your LitmusChaos GraphQL endpoint
      - LITMUS_ENDPOINT=${LITMUS_ENDPOINT:-http://litmus-server-service:9002/query}
      - LITMUS_TOKEN=${LITMUS_TOKEN:-}
      - LITMUS_PROJECT_ID=${LITMUS_PROJECT_ID:-default-project}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=http://localhost:4000
    image: chaosctrl-frontend:latest
    container_name: chaosctrl-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
